services:
  flask:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: flask
    volumes:
      - /home/razind/.uploads/images/shcool:/app/app/static/upload
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=ep-damp-cell-a2lo8071-pooler.eu-central-1.aws.neon.tech  # Изменено
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8082:80"
    networks:
      - app-network

  nginx:
    build:
      dockerfile: Dockerfile
      context: ./nginx/
    container_name: nginx
    env_file:
      - .env
    depends_on:
      - flask
    ports:
      - "8083:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
